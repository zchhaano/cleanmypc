name: Atlas Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'tests/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'install.sh'
      - 'Docs/security/**'
      - 'Apps/**'
      - 'Packages/**'
      - 'Helpers/**'
      - 'XPC/**'
      - 'Testing/**'
      - 'scripts/atlas/**'
      - 'Docs/Execution/MVP-Acceptance-Matrix.md'
      # README 媒体资产 —— 第 [6/14] 步（readme-media-gate.sh）就审这些。
      # 不列进来的话，一次「只改了截图/README 引用」的推送根本不会触发本 workflow，
      # 而那正是门禁最该跑的场景。
      - 'Docs/Media/README/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/atlas-acceptance.yml'

jobs:
  acceptance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install acceptance dependencies
        run: brew install bats-core shellcheck xcodegen

      # Runner Accessibility is determined by the actual preflight, not assumed absent.
      # This waiver covers AX/dual-timeout environment limitations only; ZERO_TESTS still fails.
      - name: Run Atlas acceptance pipeline
        env:
          ATLAS_ALLOW_UI_SKIP: "1"
        run: ./scripts/atlas/full-acceptance.sh
